server:
  port: 8080

spring:
  application:
    name: smart-parking-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_parking?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

jwt:
  secret: ${JWT_SECRET:smart-parking-development-secret-key-must-be-overridden}
  expiration: ${JWT_EXPIRATION:7200}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  issuer: ${JWT_ISSUER:smart-parking}

reservation:
  # arrive_time 超过该宽限期仍未入场则预约过期，由定时任务推进 EXPIRED 并释放车位
  expiration-grace-minutes: ${RESERVATION_EXPIRATION_GRACE_MINUTES:30}
  expiration-scan-interval-ms: ${RESERVATION_EXPIRATION_SCAN_INTERVAL_MS:60000}
  expiration-scan-initial-delay-ms: ${RESERVATION_EXPIRATION_SCAN_INITIAL_DELAY_MS:30000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

baidu:
  ocr:
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    license-plate-url: ${BAIDU_OCR_LICENSE_PLATE_URL:https://aip.baidubce.com/rest/2.0/ocr/v1/license_plate}
    token-url: ${BAIDU_OCR_TOKEN_URL:https://aip.baidubce.com/oauth/2.0/token}
    confidence-threshold: ${BAIDU_OCR_CONFIDENCE_THRESHOLD:0.8000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # rule-based：内置规则引擎（无需外部服务）；openai：OpenAI 兼容大模型接口
    provider: ${AI_PROVIDER:rule-based}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:6}
    temperature: ${AI_TEMPERATURE:0.3}
    python:
      base-url: ${AI_PYTHON_BASE_URL:http://localhost:8000}
      timeout-seconds: ${AI_PYTHON_TIMEOUT_SECONDS:30}
